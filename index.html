<!doctype html>
<html lang="fa-AF" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حساب حاجی صاحب">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>حساب حاجی صاحب</title>
<style>
:root{--navy:#12294d;--green:#2e9e6b;--gsoft:#e6f4ec;--bg:#fff;--sf:#f4f6f9;--tx:#12294d;--mu:#6b7a90;--red:#c0392b;--ln:#e3e8ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"SF Arabic","Geeza Pro",system-ui,-apple-system,Tahoma,sans-serif;font-size:17px}
body{padding:env(safe-area-inset-top) 0 0}
#view{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:22px;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:20px 20px 18px}
.hero small{opacity:.75;font-size:15px}
.hero .big{font-size:38px;font-weight:700;margin:4px 0 2px}
.hero .sub{font-size:14px;opacity:.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.mini{background:var(--sf);border-radius:18px;padding:14px;text-align:start}
.mini small{color:var(--mu);font-size:14px;display:block}
.mini b{font-size:21px}
.mini.g b{color:var(--green)}
.card{background:var(--sf);border-radius:20px;padding:16px;margin:12px 0;display:block;width:100%;text-align:start}
.bar{height:14px;background:#dfe5ed;border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}
.msg{color:var(--green);font-weight:600;font-size:15px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.btn{min-height:56px;border-radius:16px;font-weight:700;font-size:18px;padding:0 16px;width:100%}
.btn.g{background:var(--green);color:#fff}.btn.n{background:var(--navy);color:#fff}
.btn.o{background:var(--sf)}.btn.r{background:#fbeceb;color:var(--red)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;padding:14px 4px;border-bottom:1px solid var(--ln);text-align:start}
.item b{font-size:19px;white-space:nowrap}.item .s{color:var(--mu);font-size:14px;margin-top:2px}
.in b{color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px 0 10px;padding-bottom:4px}
.chip{flex:none;padding:10px 14px;border-radius:14px;background:var(--sf);font-size:15px;text-align:center}
.chip.on,.rad:checked+.chip{background:var(--navy);color:#fff}
.chip small{display:block;opacity:.8;font-size:13px}
.rad{position:absolute;opacity:0;pointer-events:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{padding:12px 4px;border-radius:11px;font-weight:600;font-size:15px}.seg .on{background:#fff;box-shadow:0 1px 4px #0002}
.bk{height:8px;background:#dfe5ed;border-radius:5px;margin-top:8px;overflow:hidden}.bk i{display:block;height:100%;background:var(--green)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
nav{position:fixed;inset:auto 0 0 0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--mu);padding:6px 0;min-height:52px}
nav button.on{color:var(--navy);font-weight:700}nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .on svg{stroke:var(--green)}
#sheet{position:fixed;inset:0;background:#12294d80;z-index:10;display:none;align-items:flex-end}
#sheet.show{display:flex}
.panel{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.panel h2{margin:0 0 12px;font-size:20px}
label{display:block;color:var(--mu);font-size:14px;margin:12px 0 5px}
input{font:inherit;font-size:18px;width:100%;min-height:52px;border:1.5px solid var(--ln);border-radius:14px;padding:0 14px;background:#fff;color:var(--tx);direction:rtl}
input:focus{outline:none;border-color:var(--green)}
input.amt{font-size:28px;font-weight:700;min-height:62px}
.hint{color:var(--mu);font-size:13px;margin-top:4px}.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;z-index:20;display:none;font-size:16px}
</style>
</head>
<body>
<div id="view"></div>
<nav id="nav"></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<script>
const SRC=['ALHAM WATER','کرایه املاک','سایر درآمدها'],KEY='hajisahib.v1';
const blank=()=>({v:1,opening:0,goal:{name:'',target:0},tx:[],debts:[]});
const load=()=>{try{const s=localStorage.getItem(KEY);if(s)return Object.assign(blank(),JSON.parse(s))}catch(e){}return blank()};
let D=load(),tab='home',seg='owed',flt=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){toast('ذخیره نشد! حافظه دستگاه را بررسی کنید');return false}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=s=>{s=String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,،\s]/g,'').replace('٫','.');const n=parseFloat(s);return isFinite(n)?n:NaN};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('fa-AF');
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const pd=iso=>{try{return new Intl.DateTimeFormat('fa-AF-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(new Date(iso+'T12:00:00'))}catch(e){return iso}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)};
const paid=d=>d.pays.reduce((a,b)=>a+b.amount,0),rem=d=>d.amount-paid(d);

function calc(){let i=0,o=0,s=0,by={};
 D.tx.forEach(t=>{if(t.type==='in'){i+=t.amount;by[t.src]=(by[t.src]||0)+t.amount}else if(t.type==='out')o+=t.amount;else s+=t.amount});
 let dIn=0,dOut=0;D.debts.forEach(d=>{d.dir==='owed'?dIn+=paid(d):dOut+=paid(d)});
 return{i,o,s,dIn,dOut,by,bal:D.opening+i+dIn-o-dOut}}

const ic={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',in:'<path d="M12 4v14M6 12l6 6 6-6"/>',out:'<path d="M12 20V6M6 12l6-6 6 6"/>',debt:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>'};
const TABS=[['home','خانه'],['in','دریافت'],['out','مصرف'],['debt','باقی‌داری']];
function render(){
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ic[k]}</svg>${l}</button>`).join('');
 $('#view').innerHTML=({home:vHome,in:()=>vList('in'),out:()=>vList('out'),debt:vDebt})[tab]()}
function go(t){tab=t;flt=null;render();scrollTo(0,0)}

function saveMsg(p,hasGoal){if(!hasGoal)return'یک هدف بگذارید و پس‌انداز را شروع کنید.';
 return p>=100?'آفرین! به هدفتان رسیدید.':p>=75?'تقریباً رسیدید، کمی دیگر!':p>=50?'نیمه راه را گذشتید، ادامه دهید.':p>=25?'شروع خوبی است، همین‌طور ادامه دهید.':p>0?'هر قدم کوچک شمارش می‌شود.':'اولین مبلغ پس‌انداز را کنار بگذارید.'}

function vHome(){const c=calc(),g=D.goal,has=g.target>0,p=has?Math.min(100,c.s/g.target*100):0,cash=c.bal-c.s;
 return`<h1>حساب حاجی صاحب<button onclick="fSettings()" aria-label="تنظیمات" style="font-size:24px;padding:6px 10px">⚙︎</button></h1>
 <div class="hero"><small>موجودی فعلی</small><div class="big">${fmt(c.bal)}</div><div class="sub">در پس‌انداز ${fmt(c.s)} · نقد ${fmt(cash)}</div></div>
 <div class="acts"><button class="btn g" onclick="fTx('in')">+ دریافت</button><button class="btn n" onclick="fTx('out')">− مصرف</button></div>
 <div class="row2"><button class="mini g" onclick="go('in')"><small>مجموع دریافت‌ها</small><b>${fmt(c.i)}</b></button><button class="mini" onclick="go('out')"><small>مجموع مصارف</small><b>${fmt(c.o)}</b></button></div>
 ${(c.dIn||c.dOut)?`<div class="hint" style="margin:-4px 4px 8px">پرداخت‌های باقی‌داری: دریافت ${fmt(c.dIn)} · پرداخت ${fmt(c.dOut)}</div>`:''}
 <button class="card" onclick="fSave()"><b>${has?esc(g.name||'هدف پس‌انداز'):'هدف پس‌انداز'}</b>
  <div class="bar"><i style="width:${p}%"></i></div>
  <div style="display:flex;justify-content:space-between;font-size:15px"><span>${fmt(c.s)}${has?' از '+fmt(g.target):''}</span><span>${has?fmt(Math.floor(p))+'٪':''}</span></div>
  <div class="msg" style="margin-top:8px">${saveMsg(p,has)}</div></button>`}

function vList(type){const c=calc(),isIn=type==='in';
 let L=D.tx.filter(t=>t.type===type&&(!flt||t.src===flt)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 const total=L.reduce((a,t)=>a+t.amount,0);
 return`<h1>${isIn?'دریافت پول':'مصرف پول'}</h1>
 <button class="btn ${isIn?'g':'n'}" onclick="fTx('${type}')">${isIn?'+ ثبت دریافت':'− ثبت مصرف'}</button>
 ${isIn?`<div class="chips" style="margin-top:14px"><button class="chip ${!flt?'on':''}" onclick="flt=null;render()">همه<small>${fmt(c.i)}</small></button>${SRC.map(s=>`<button class="chip ${flt===s?'on':''}" onclick="flt='${s}';render()">${s}<small>${fmt(c.by[s]||0)}</small></button>`).join('')}</div>`:`<div class="hint" style="margin:12px 4px 0">مجموع: ${fmt(total)}</div>`}
 ${L.length?L.map(t=>`<button class="item ${isIn?'in':''}" onclick="fTx('${type}','${t.id}')"><div><div>${esc(isIn?t.src:(t.reason||'مصرف'))}</div><div class="s">${pd(t.date)}${!isIn&&t.who?' · '+esc(t.who):''}${t.note?' · '+esc(t.note):''}</div></div><b>${isIn?'+':'−'}${fmt(t.amount)}</b></button>`).join(''):`<div class="empty">هنوز چیزی ثبت نشده.<br>با دکمهٔ بالا شروع کنید.</div>`}`}

function vDebt(){const L=D.debts.filter(d=>d.dir===seg).sort((a,b)=>(rem(b)>0)-(rem(a)>0)||b.date.localeCompare(a.date));
 const tot=L.reduce((a,d)=>a+rem(d),0),owed=seg==='owed';
 return`<h1>باقی‌داری</h1>
 <div class="seg"><button class="${owed?'on':''}" onclick="seg='owed';render()">طلب من از دیگران</button><button class="${!owed?'on':''}" onclick="seg='owe';render()">قرض من به دیگران</button></div>
 <div class="hero" style="padding:16px 20px"><small>${owed?'جمع مانده طلب‌ها':'جمع مانده قرض‌ها'}</small><div class="big" style="font-size:30px">${fmt(tot)}</div></div>
 <div style="height:12px"></div><button class="btn ${owed?'g':'n'}" onclick="fDebt()">+ ثبت ${owed?'طلب':'قرض'} جدید</button>
 ${L.length?L.map(d=>{const r=rem(d),pc=Math.min(100,paid(d)/d.amount*100);return`<button class="item" style="display:block" onclick="fDebtView('${d.id}')"><div style="display:flex;justify-content:space-between"><span>${esc(d.who)}</span><b>${r>0?fmt(r):'تسویه شد ✓'}</b></div><div class="s">از ${fmt(d.amount)} · ${pd(d.date)}${d.note?' · '+esc(d.note):''}</div><div class="bk"><i style="width:${pc}%"></i></div></button>`}).join(''):`<div class="empty">موردی ثبت نشده.</div>`}`}

/* ---------- sheets ---------- */
function openSheet(h,focus){$('#panel').innerHTML=h;$('#sheet').classList.add('show');if(focus)setTimeout(()=>{const e=$(focus);e&&e.focus()},60)}
function closeSheet(){$('#sheet').classList.remove('show')}
const dateField=v=>`<label>تاریخ</label><input type="date" id="f_date" value="${v}" oninput="$('#pdl').textContent=pd(this.value)"><div class="hint" id="pdl">${pd(v)}</div>`;
const amtField=(v,l='مبلغ')=>`<label>${l}</label><input class="amt" id="f_amt" inputmode="decimal" autocomplete="off" placeholder="۰" value="${v===''?'':esc(v)}">`;
const dl=(id,arr)=>`<datalist id="${id}">${[...new Set(arr.filter(Boolean))].slice(0,30).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
const val=id=>$('#'+id).value.trim();
function getAmt(){const n=num(val('f_amt'));if(!(n>0)){$('#err').textContent='مبلغ را درست وارد کنید.';return null}return n}

function fTx(type,id){const e=id?D.tx.find(x=>x.id===id):null,t=e||{amount:'',date:today(),src:SRC[0],note:'',reason:'',who:''},isIn=type==='in';
 openSheet(`<h2>${e?'ویرایش ':'ثبت '}${isIn?'دریافت':'مصرف'}</h2>${amtField(t.amount)}
 ${isIn?`<label>منبع پول</label><div class="chips">${SRC.map(s=>`<label style="margin:0"><input class="rad" type="radio" name="src" value="${s}" ${t.src===s?'checked':''}><span class="chip">${s}</span></label>`).join('')}</div>`
 :`<label>علت مصرف</label><input id="f_reason" list="dl1" value="${esc(t.reason)}" placeholder="مثلاً خرچ خانه">${dl('dl1',D.tx.map(x=>x.reason))}<label>پرداخت به</label><input id="f_who" list="dl2" value="${esc(t.who)}" placeholder="نام شخص">${dl('dl2',D.tx.map(x=>x.who))}`}
 ${dateField(t.date)}<label>توضیح کوتاه (اختیاری)</label><input id="f_note" value="${esc(t.note)}"><div class="err" id="err"></div>
 <button class="btn ${isIn?'g':'n'}" onclick="svTx('${type}','${id||''}')">ذخیره</button>${e?`<div style="height:10px"></div><button class="btn r" onclick="del('tx','${id}')">حذف</button>`:''}`,'#f_amt')}
function svTx(type,id){const a=getAmt();if(a===null)return;
 const o={type,amount:a,date:val('f_date')||today(),note:val('f_note')};
 if(type==='in'){o.src=(document.querySelector('input[name=src]:checked')||{}).value||SRC[2]}else{o.reason=val('f_reason');o.who=val('f_who')}
 if(id)Object.assign(D.tx.find(x=>x.id===id),o);else D.tx.push({id:uid(),...o});
 done('ثبت شد')}

function fSave(){const c=calc(),L=D.tx.filter(t=>t.type==='save').sort((a,b)=>b.date.localeCompare(a.date));
 openSheet(`<h2>پس‌انداز</h2><div class="hint">انتقال به پس‌انداز از موجودی کم یا زیاد نمی‌کند و مصرف حساب نمی‌شود.</div>${amtField('','مبلغ انتقال به پس‌انداز')}${dateField(today())}<div class="err" id="err"></div>
 <button class="btn g" onclick="svSave()">انتقال به پس‌انداز</button>
 ${L.length?`<label style="margin-top:18px">انتقال‌های قبلی</label>`+L.map(t=>`<div class="item"><div>${pd(t.date)}</div><div><b>${fmt(t.amount)}</b> <button onclick="del('tx','${t.id}')" style="color:var(--red);font-size:22px;padding:6px 10px">×</button></div></div>`).join(''):''}`,'#f_amt')}
function svSave(){const a=getAmt();if(a===null)return;D.tx.push({id:uid(),type:'save',amount:a,date:val('f_date')||today()});done('به پس‌انداز اضافه شد')}

function fDebt(id){const e=id?D.debts.find(x=>x.id===id):null,owed=e?e.dir==='owed':seg==='owed',t=e||{who:'',amount:'',date:today(),note:''};
 openSheet(`<h2>${e?'ویرایش':'ثبت'} ${owed?'طلب':'قرض'}</h2><label>${owed?'چه کسی به من بدهکار است؟':'من به چه کسی بدهکارم؟'}</label><input id="f_who" list="dl3" value="${esc(t.who)}">${dl('dl3',D.debts.map(x=>x.who))}
 ${amtField(t.amount)}${dateField(t.date)}<label>توضیح (اختیاری)</label><input id="f_note" value="${esc(t.note)}"><div class="err" id="err"></div>
 <button class="btn ${owed?'g':'n'}" onclick="svDebt('${id||''}','${owed?'owed':'owe'}')">ذخیره</button>`,'#f_who')}
function svDebt(id,dir){const w=val('f_who');if(!w){$('#err').textContent='نام را بنویسید.';return}const a=getAmt();if(a===null)return;
 const o={who:w,amount:a,date:val('f_date')||today(),note:val('f_note')};
 if(id){const d=D.debts.find(x=>x.id===id);if(a<paid(d)){$('#err').textContent='مبلغ از پرداخت‌شده کمتر شده نمی‌تواند.';return}Object.assign(d,o)}else D.debts.push({id:uid(),dir,pays:[],...o});
 done('ثبت شد')}
function fDebtView(id){const d=D.debts.find(x=>x.id===id),owed=d.dir==='owed',r=rem(d);
 openSheet(`<h2>${esc(d.who)}</h2><div class="hint">کل ${fmt(d.amount)} · پرداخت‌شده ${fmt(paid(d))}</div><div class="big" style="font-size:32px;font-weight:700;margin:6px 0">${r>0?'مانده: '+fmt(r):'تسویه شد ✓'}</div>
 ${r>0?`${amtField(r,owed?'مبلغ دریافت‌شده':'مبلغ پرداخت‌شده')}${dateField(today())}<div class="err" id="err"></div><button class="btn g" onclick="svPay('${id}')">${owed?'ثبت دریافت جزئی':'ثبت پرداخت جزئی'}</button>`:''}
 ${d.pays.length?`<label style="margin-top:16px">سابقهٔ پرداخت‌ها</label>`+d.pays.map(p=>`<div class="item"><div>${pd(p.date)}</div><div><b>${fmt(p.amount)}</b> <button onclick="delPay('${id}','${p.id}')" style="color:var(--red);font-size:22px;padding:6px 10px">×</button></div></div>`).join(''):''}
 <div class="acts"><button class="btn o" onclick="fDebt('${id}')">ویرایش</button><button class="btn r" onclick="del('debt','${id}')">حذف</button></div>`,r>0?'#f_amt':null)}
function svPay(id){const d=D.debts.find(x=>x.id===id),a=getAmt();if(a===null)return;if(a>rem(d)+1e-9){$('#err').textContent='مبلغ از مانده بیشتر است.';return}
 d.pays.push({id:uid(),amount:a,date:val('f_date')||today()});done('ثبت شد')}
function delPay(id,pid){if(!confirm('این پرداخت حذف شود؟'))return;const d=D.debts.find(x=>x.id===id);d.pays=d.pays.filter(p=>p.id!==pid);save();render();fDebtView(id)}
function del(k,id){if(!confirm('حذف شود؟'))return;if(k==='tx')D.tx=D.tx.filter(x=>x.id!==id);else D.debts=D.debts.filter(x=>x.id!==id);done('حذف شد')}
function done(m){if(!save())return;closeSheet();render();toast(m)}

function fSettings(){const last=localStorage.getItem(KEY+'.last');
 openSheet(`<h2>تنظیمات</h2><label>موجودی آغازین</label><input id="f_open" inputmode="decimal" value="${D.opening||''}" placeholder="۰">
 <label>نام هدف پس‌انداز</label><input id="f_gn" value="${esc(D.goal.name)}" placeholder="مثلاً خرید زمین"><label>مبلغ هدف</label><input id="f_gt" inputmode="decimal" value="${D.goal.target||''}" placeholder="۰">
 <div class="err" id="err"></div><button class="btn g" onclick="svSet()">ذخیره</button>
 <label style="margin-top:20px">پشتیبان‌گیری ${last?'· آخرین: '+pd(last):'· هنوز گرفته نشده'}</label>
 <div class="acts"><button class="btn o" onclick="backup()">گرفتن نسخه پشتیبان</button><button class="btn o" onclick="$('#f_file').click()">بازیابی</button></div>
 <input type="file" id="f_file" accept=".json,application/json" style="display:none" onchange="restore(this.files[0])">`)}
function svSet(){const o=val('f_open')?num(val('f_open')):0,t=val('f_gt')?num(val('f_gt')):0;
 if(isNaN(o)||isNaN(t)||t<0){$('#err').textContent='عدد درست وارد کنید.';return}
 D.opening=o;D.goal={name:val('f_gn'),target:t};done('ذخیره شد')}
async function backup(){const blob=new Blob([JSON.stringify(D)],{type:'application/json'}),f=new File([blob],'hisab-haji-sahib-'+today()+'.json',{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});localStorage.setItem(KEY+'.last',today());return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();localStorage.setItem(KEY+'.last',today());toast('نسخه پشتیبان آماده شد')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.tx)||!Array.isArray(j.debts))throw 0;
 if(!confirm('اطلاعات فعلی با نسخه پشتیبان جایگزین شود؟'))return;D=Object.assign(blank(),j);done('بازیابی شد')}catch(e){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f)}

render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
